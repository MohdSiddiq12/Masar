name: Collect Traffic Data

on:
  schedule:
    - cron: '7 * * * *'              # every hour at minute 7 UTC
  workflow_dispatch:                # manual button

permissions:
  contents: read

concurrency:
  group: traffic-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug - Check secrets are present
        run: |
          missing=0
          for variable in TOMTOM_API_KEY OPENWEATHER_API_KEY SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error::Required secret $variable is missing"
              missing=1
            else
              echo "$variable is set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      - name: Run collection script
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting collection at $(date -u)"
          python -m scripts.collect_traffic
          echo "Collection finished at $(date -u)"

      - name: Collect Reddit chatter
        continue-on-error: true
        env:
          REDDIT_USER_AGENT: masar-traffic-agent/1.0
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m scripts.collect_chatter