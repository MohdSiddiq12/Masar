name: Collect Traffic Data

run-name: "Traffic Collection • ${{ github.event_name }} • ${{ github.run_number }}"

on:
  schedule:
    # Every 5 minutes (288 runs/day)
    - cron: "*/5 * * * *"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate required secrets
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          echo "Checking required secrets..."
          missing=0

          for variable in TOMTOM_API_KEY OPENWEATHER_API_KEY SUPABASE_URL SUPABASE_KEY; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing secret: $variable"
              missing=1
            else
              echo "✓ $variable"
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Collect live traffic & weather
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "======================================="
          echo " MASAR LIVE DATA COLLECTION"
          echo " UTC: $(date -u)"
          echo "======================================="

          python -m scripts.collect_traffic

          echo "======================================="
          echo " COLLECTION COMPLETED"
          echo " UTC: $(date -u)"
          echo "======================================="

      - name: Collect Reddit chatter (non-blocking)
        continue-on-error: true
        env:
          REDDIT_USER_AGENT: masar-traffic-agent/1.0
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Collecting Reddit traffic chatter..."
          python -m scripts.collect_chatter

      - name: Workflow summary
        if: always()
        run: |
          echo "## Masar Collection Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Frequency | Every 5 minutes |" >> $GITHUB_STEP_SUMMARY
          echo "| Run Number | $GITHUB_RUN_NUMBER |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | $GITHUB_EVENT_NAME |" >> $GITHUB_STEP_SUMMARY
          echo "| UTC Time | $(date -u) |" >> $GITHUB_STEP_SUMMARY