name: Collect Traffic Data

on:
  schedule:
    - cron: '*/10 * * * *'          # every 10 minutes
  workflow_dispatch:                # manual button

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Debug - Check secrets are present
        run: |
          echo "TOMTOM_API_KEY is set: ${{ secrets.TOMTOM_API_KEY != '' }}"
          echo "OPENWEATHER_API_KEY is set: ${{ secrets.OPENWEATHER_API_KEY != '' }}"
          echo "SUPABASE_URL is set: ${{ secrets.SUPABASE_URL != '' }}"
          echo "SUPABASE_KEY is set: ${{ secrets.SUPABASE_KEY != '' }}"
          echo "REDDIT_CLIENT_ID is set: ${{ secrets.REDDIT_CLIENT_ID != '' }}"
          echo "REDDIT_CLIENT_SECRET is set: ${{ secrets.REDDIT_CLIENT_SECRET != '' }}"

      - name: Run collection script
        env:
          TOMTOM_API_KEY: ${{ secrets.TOMTOM_API_KEY }}
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          echo "Starting collection at $(date -u)"
          python collect_traffic.py
          echo "Collection finished at $(date -u)"

      - name: Collect Reddit chatter
        continue-on-error: true
        env:
          REDDIT_USER_AGENT: masar-traffic-agent/1.0
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python collect_chatter.py